[package]
name = "bit-codec"
description = "A Rust crate for easy bitwise encoding (serializing) and decoding (deserializing)."
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zitronenjoghurt/bit-codec"
readme = "../README.md"

[features]
derive = ["bit-codec-derive"]

[dependencies]
bit-codec-derive = { version = "0.2.0", optional = true }

[dev-dependencies]
bit-codec = { path = ".", features = ["derive"] }